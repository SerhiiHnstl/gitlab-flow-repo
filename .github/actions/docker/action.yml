name: 'Docker'
description: 'Composite action for docker image using prebuilt artifact (echo only)'
runs:
  using: 'composite'
  steps:
    - shell: bash
      run: |
        echo "🐳 [DOCKER] Using prebuilt artifact from ./dist:"
        ls -la dist || echo "⚠️ no dist found"
        echo "🐳 [DOCKER] docker build -t demo-app:latest . (artifact reused, no rebuild) ... BUILT"