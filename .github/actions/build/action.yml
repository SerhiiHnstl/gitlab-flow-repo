name: 'Build'
description: 'Composite action for building artifacts (echo only) and exposing output dir'
outputs:
  artifact-path:
    description: 'Path to build output'
    value: ${{ steps.build.outputs.artifact-path }}
runs:
  using: 'composite'
  steps:
    - id: build
      shell: bash
      run: |
        echo "🏗️ [BUILD] Building artifacts... DONE"
        mkdir -p dist
        echo "demo-app-binary-$(date +%s)" > dist/app.bundle
        echo "artifact-path=dist" >> "$GITHUB_OUTPUT"
        echo "📦 [BUILD] Artifact created at ./dist/app.bundle"