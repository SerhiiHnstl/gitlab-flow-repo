name: ENV · 2preprod

on:
  push:
    branches: ['2preprod']
  pull_request:
    branches: ['2preprod']

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      environment: '2preprod'

  cd:
    needs: ci
    if: github.event_name == 'push'
    uses: ./.github/workflows/cd.yml
    with:
      stage_env: '2preprod'
      prod_env: '2prod'