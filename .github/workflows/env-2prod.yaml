name: ENV · 2prod

on:
  push:
    branches: ['2prod']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate direct prod change
        run: echo "🔒 [2prod] Direct change on prod branch detected. Running validation + redeploy."

  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      environment: '2prod'

  deploy:
    needs: ci
    uses: ./.github/workflows/deploy.yml
    with:
      environment: '2prod'