name: preprod

on:
  push:
    branches: [preprod]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: preprod
      image-tag: ${{ github.sha }}

  smoke:
    needs: deploy
    uses: ./.github/workflows/smoke.yml
    with:
      base_url: ${{ needs.deploy.outputs.app_url }}

  e2e:
    needs: deploy
    uses: ./.github/workflows/e2e.yml
    with:
      base_url: ${{ needs.deploy.outputs.app_url }}
