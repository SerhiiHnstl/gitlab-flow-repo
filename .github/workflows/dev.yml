name: dev

on:
  push:
    branches: [dev]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      id-token: write

  deploy:
    needs: build
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: dev
      image-tag: ${{ needs.build.outputs.image-tag }}

  smoke:
    needs: deploy
    uses: ./.github/workflows/smoke.yml
    with:
      base_url: ${{ needs.deploy.outputs.app_url }}
