name: dev

on:
  push:
    branches: [dev]

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: build
    if: github.event_name == 'push'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      image-tag: ${{ needs.build.outputs.image-tag }}

  smoke:
    needs: deploy
    if: github.event_name == 'push'
    uses: ./.github/workflows/smoke.yml
    with:
      base_url: ${{ needs.deploy.outputs.app_url }}
