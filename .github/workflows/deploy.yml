name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment to deploy (dev|qa|preprod|prod|perf)'
        required: true
        type: string
      image-tag:
        description: 'Immutable version (image tag) to deploy'
        required: true
        type: string
    outputs:
      app_url:
        description: 'Public URL of the deployed environment (consumed by smoke/e2e)'
        value: ${{ jobs.deploy.outputs.app_url }}

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.app_url.outputs.app_url }}
    outputs:
      app_url: ${{ steps.app_url.outputs.app_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/deploy
        with:
          environment: ${{ inputs.environment }}
          image-tag: ${{ inputs.image-tag }}

      - name: Resolve app URL
        id: app_url
        run: |
          APP_URL="https://${{ inputs.environment }}.example.com"
          echo "app_url=${APP_URL}" >> "$GITHUB_OUTPUT"
          echo "[INFO] [DEPLOY] env=${{ inputs.environment }} version=${{ inputs.image-tag }} url=${APP_URL}"