name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment to deploy (e.g. 1dev, 2qa, 1prod)'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore cache
        uses: ./.github/actions/setup-cache
        with:
          cache-key-prefix: ${{ inputs.environment }}

      - name: Deploy application
        uses: ./.github/actions/deploy
        with:
          environment: ${{ inputs.environment }}

      - name: Post-deploy smoke test
        uses: ./.github/actions/smoke-test

      - name: Done
        run: echo "✅ [DEPLOY] Environment '${{ inputs.environment }}' is live and healthy."