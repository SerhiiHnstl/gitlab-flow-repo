name: prod

on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Version to redeploy (default: current commit SHA)'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      image-tag: ${{ inputs.image-tag || github.sha }}

  smoke:
    needs: deploy
    uses: ./.github/workflows/smoke.yml
    with:
      base_url: ${{ needs.deploy.outputs.app_url }}
