name: Reusable CI

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: string

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cache
        with:
          cache-key-prefix: ${{ inputs.environment }}
      - uses: ./.github/actions/lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cache
        with:
          cache-key-prefix: ${{ inputs.environment }}
      - uses: ./.github/actions/test

  # ---------- BUILD: produces artifact + warms docker-layer cache ----------
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-cache
        with:
          cache-key-prefix: ${{ inputs.environment }}

      # 🐳 Docker-layer cache shared with the docker job (same key)
      - name: Restore docker layer cache
        uses: actions/cache@v4
        with:
          path: /tmp/.docker-cache
          key: docker-layers-${{ inputs.environment }}-${{ github.sha }}
          restore-keys: |
            docker-layers-${{ inputs.environment }}-

      - name: Build
        uses: ./.github/actions/build

      - name: Warm docker layer cache
        run: |
          mkdir -p /tmp/.docker-cache
          echo "layer-base"   > /tmp/.docker-cache/layer1
          echo "layer-deps"   > /tmp/.docker-cache/layer2
          echo "🐳 [CACHE] Docker layers prepared in build job."

      # 📤 Pass build output (dist/) to the docker job
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-${{ inputs.environment }}
          path: dist/
          retention-days: 1

  # ---------- DOCKER: reuses artifact + same docker-layer cache ----------
  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 📥 Download build output from the build job
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact-${{ inputs.environment }}
          path: dist/

      # 🐳 Restore SAME docker-layer cache the build job created
      - name: Restore docker layer cache
        uses: actions/cache@v4
        with:
          path: /tmp/.docker-cache
          key: docker-layers-${{ inputs.environment }}-${{ github.sha }}
          restore-keys: |
            docker-layers-${{ inputs.environment }}-

      - name: Show shared docker cache
        run: |
          echo "🐳 [CACHE] Docker layers restored from build job:"
          ls -la /tmp/.docker-cache || echo "⚠️ no docker cache"

      - name: Docker build (reusing artifact + layers)
        uses: ./.github/actions/docker

      - run: echo "✅ [CI] Pipeline finished for environment = ${{ inputs.environment }}"