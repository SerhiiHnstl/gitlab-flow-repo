name: Build

on:
  workflow_call:
    outputs:
      image-tag:
        description: 'Immutable version (= commit SHA)'
        value: ${{ jobs.build.outputs.image-tag }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build
        with:
          image-tag: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: dist/
          retention-days: 30

  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: dist/
      - uses: ./.github/actions/docker
        with:
          image-tag: ${{ github.sha }}
      - run: echo "[INFO] [BUILD] Published image-tag=${{ github.sha }}"
