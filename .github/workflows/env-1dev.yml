name: ENV · 1dev

on:
  push:
    branches: ['1dev']
  pull_request:
    branches: ['1dev']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      environment: '1dev'

  deploy:
    needs: ci
    if: github.event_name == 'push' 
    uses: ./.github/workflows/deploy.yml
    with:
      environment: '1dev'
      image-tag: ${{ needs.ci.outputs.image-tag }}