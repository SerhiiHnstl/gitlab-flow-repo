name: ENV · 2qa

on:
  push:
    branches: ['2qa']
  pull_request:
    branches: ['2qa']

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      environment: '2qa'

  deploy:
    needs: ci
    if: github.event_name == 'push'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: '2qa'