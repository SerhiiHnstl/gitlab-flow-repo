name: ENV · 2dev

on:
  push:
    branches: ['2dev']
  pull_request:
    branches: ['2dev']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      environment: '2dev'

  deploy:
    needs: ci
    if: github.event_name == 'push'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: '2dev'
      image-tag: ${{ needs.ci.outputs.image-tag }}