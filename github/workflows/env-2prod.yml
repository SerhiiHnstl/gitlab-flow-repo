name: ENV · 2prod (HOTFIX ONLY)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Hotfix reason (required for audit log)'
        required: true
        type: string
      image-tag:
        description: 'Existing image tag to redeploy (git SHA from a previous CI run)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hotfix-2prod
  cancel-in-progress: false

jobs:
  hotfix-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: '2prod'
    steps:
      - uses: actions/checkout@v4
      - run: echo "[WARN] [HOTFIX] Hotfix deployment to 2prod triggered actor=${{ github.actor }} reason=${{ inputs.reason }} image-tag=${{ inputs.image-tag }}"
      - uses: ./.github/actions/deploy
        with:
          environment: '2prod'
          image-tag: ${{ inputs.image-tag }}
      - run: echo "[INFO] [HOTFIX] Hotfix deployed environment=2prod image-tag=${{ inputs.image-tag }}"